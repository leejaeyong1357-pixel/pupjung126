<title>사외직무교육 계획 취합</title>
<style>
:root{
  --navy:#0B3C77; --blue:#1A6AD4; --blue-soft:#EAF1FC; --blue-line:#C6DAF6;
  --ground:#F4F6FA; --panel:#FFFFFF; --panel-2:#FAFBFD; --panel-3:#F1F4F9;
  --ink:#0E1726; --ink-2:#55647B; --ink-3:#8795A8;
  --line:#E1E7F0; --line-2:#EDF1F6;
  --ok:#0C7A52; --ok-soft:#E4F4EC; --ok-line:#B9E2CE;
  --wait:#A96500; --wait-soft:#FDF2E2; --wait-line:#F0D7AE;
  --no:#C62828; --no-soft:#FCEBEB; --no-line:#F3C9C9;
  --shadow-s:0 1px 2px rgba(11,60,119,.06);
  --shadow-m:0 1px 3px rgba(11,60,119,.07),0 8px 24px rgba(11,60,119,.06);
  --shadow-l:0 18px 50px rgba(11,60,119,.16);
  --r:10px; --logo-pad:0px; --logo-bg:transparent;
  /* 외부에서 내려받지 않고 PC에 이미 깔린 글꼴만 씁니다(인터넷 불필요). */
  --kr:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
       "Apple SD Gothic Neo","Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
  --num:var(--kr);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#5E9BEC; --blue:#4D8FE8; --blue-soft:#15243A; --blue-line:#27446E;
  --ground:#0C1118; --panel:#141A23; --panel-2:#19202B; --panel-3:#1E2630;
  --ink:#E8EDF4; --ink-2:#9AAABF; --ink-3:#6E7F96;
  --line:#252F3C; --line-2:#1F2733;
  --ok:#43C892; --ok-soft:#0E2A20; --ok-line:#1D4A38;
  --wait:#E0A84A; --wait-soft:#2B2113; --wait-line:#4A3A1C;
  --no:#F0736A; --no-soft:#2D1817; --no-line:#4E2624;
  --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow-m:0 2px 10px rgba(0,0,0,.45);
  --shadow-l:0 18px 50px rgba(0,0,0,.6);
  --logo-pad:5px 9px; --logo-bg:#fff;
}}
:root[data-theme="dark"]{
  --navy:#5E9BEC; --blue:#4D8FE8; --blue-soft:#15243A; --blue-line:#27446E;
  --ground:#0C1118; --panel:#141A23; --panel-2:#19202B; --panel-3:#1E2630;
  --ink:#E8EDF4; --ink-2:#9AAABF; --ink-3:#6E7F96;
  --line:#252F3C; --line-2:#1F2733;
  --ok:#43C892; --ok-soft:#0E2A20; --ok-line:#1D4A38;
  --wait:#E0A84A; --wait-soft:#2B2113; --wait-line:#4A3A1C;
  --no:#F0736A; --no-soft:#2D1817; --no-line:#4E2624;
  --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow-m:0 2px 10px rgba(0,0,0,.45);
  --shadow-l:0 18px 50px rgba(0,0,0,.6);
  --logo-pad:5px 9px; --logo-bg:#fff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--kr);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--kr);font-size:13.5px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
input[type=date]{font-family:var(--num)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow-s)}
.topbar-in{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:26px;height:60px}
@media (max-width:900px){
  .topbar-in{height:auto;flex-wrap:wrap;gap:10px;padding:10px 16px}
  .brand{order:1} .topright{order:2;margin-left:auto}
  .mainnav{order:3;flex:1 0 100%;border-top:1px solid var(--line-2);padding-top:8px}
  .who .nm,.who .dp{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn span{display:none}
}
.brand{display:flex;align-items:center;gap:13px;flex-shrink:0;padding:6px 9px;margin-left:-9px;
  border-radius:8px;cursor:pointer;transition:.14s}
.brand:hover{background:var(--panel-3)}
.brand img{height:19px;width:auto;display:block;background:var(--logo-bg);padding:var(--logo-pad);border-radius:5px}
.brand .sep{width:1px;height:17px;background:var(--line)}
.brand .app{font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em;white-space:nowrap}
.mainnav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.mainnav::-webkit-scrollbar{display:none}
.mainnav button{padding:8px 13px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.mainnav button:hover{background:var(--panel-3);color:var(--ink)}
.mainnav button.on{color:var(--blue);background:var(--blue-soft);font-weight:700}
.mainnav button .n{margin-left:6px;font-family:var(--num);font-size:11px;background:var(--no);color:#fff;
  padding:1px 5px;border-radius:9px;font-weight:600;vertical-align:1px}
.topright{display:flex;align-items:center;gap:12px;flex-shrink:0}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.who .nm{font-size:13px;font-weight:700;line-height:1.25}
.who .dp{font-size:11.5px;color:var(--ink-3);line-height:1.25}
.iconbtn{padding:7px 9px;border-radius:7px;color:var(--ink-3);font-size:12.5px;display:flex;align-items:center;gap:5px}
.iconbtn:hover{background:var(--panel-3);color:var(--ink)}

/* ---------- layout ---------- */
.shell{max-width:1440px;margin:0 auto;padding:22px 24px 40px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.grid2>main{min-width:0}
@media (max-width:1180px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.shell{padding:16px 16px 30px}}

/* 히어로 — 왼쪽 연한 파랑에서 오른쪽 사진으로 이어집니다.
   사진 왼쪽 끝이 #E4F0FD 라 배경색과 경계 없이 붙습니다. */
.hero{position:relative;border-radius:14px;overflow:hidden;margin-bottom:18px;
  background:#E4F0FD url("/hero.jpg") right center/auto 100% no-repeat;
  border:1px solid #D3E4F8}
.hero::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,#E4F0FD 0%,#E4F0FD 40%,rgba(228,240,253,.55) 55%,rgba(228,240,253,0) 68%)}
.hero-in{position:relative;z-index:1;padding:26px 30px 28px;max-width:640px}
.hero-meta{margin-bottom:11px}
.hero h1{font-size:clamp(22px,2.4vw,29px);font-weight:900;letter-spacing:-.04em;color:#0C2B52}
.hero p{margin:8px 0 0;font-size:14px;color:#3A5E88}
.hero-acts{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.hero-acts .btn{padding:11px 19px}
@media (max-width:820px){
  .hero{background-image:none;background:linear-gradient(135deg,#E4F0FD,#F2F8FE)}
  .hero-in{max-width:none;padding:22px}
}

.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ok);
  background:var(--ok-soft);border:1px solid var(--ok-line);padding:4px 11px;border-radius:20px}
.pagehead h1{font-size:26px;font-weight:900;letter-spacing:-.035em}
.pagehead p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px}
.pagehead .acts{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 17px;border-radius:8px;
  font-size:13.5px;font-weight:700;background:var(--blue);color:#fff;box-shadow:var(--shadow-s);transition:.14s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue);filter:none}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:7px}
.btn.ok{background:var(--ok)} .btn.no{background:var(--no)}
.btn[disabled]{opacity:.45;pointer-events:none}

.note{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:var(--r);
  padding:12px 15px;font-size:13px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.note svg{flex-shrink:0;margin-top:1px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-m);margin-bottom:20px;overflow:hidden}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:17px 20px;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:none}
@media (max-width:760px){.kpi:nth-child(2n){border-right:none}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line-2)}}
.kpi .lab{font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.01em}
.kpi .val{font-family:var(--num);font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:3px;line-height:1.15}
.kpi .val small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.accent .val{color:var(--blue)}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-m);overflow:hidden}
.card+.card{margin-top:20px}
.card-h{padding:15px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:15px;display:flex;align-items:center;gap:9px}
.count{font-family:var(--num);font-size:12px;font-weight:600;background:var(--panel-3);color:var(--ink-2);
  padding:2px 8px;border-radius:20px}
.card-h .right{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;max-width:100%}
.card-b{padding:18px 20px}
.subtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{padding:11px 3px;margin-right:20px;font-size:13.5px;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:700}
.subtabs button:hover{color:var(--ink)}
.searchwrap{position:relative;width:250px;max-width:100%}
.searchwrap input{padding-left:33px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
select.filt{width:auto;min-width:120px;font-size:13px;padding:8px 10px}

/* ---------- table ---------- */
.tw{overflow-x:auto;scrollbar-width:thin}
.tw::-webkit-scrollbar{height:9px}
.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.tw::-webkit-scrollbar-track{background:var(--panel-2)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.6px}
th,td{padding:10px 11px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line-2)}
thead th{background:var(--panel-2);font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.01em;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
thead th.ctr,td.ctr{text-align:center}
thead th.rt,td.rt{text-align:right}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:none}
td.nm{font-weight:700}
/* 표 맨 위 흐린 예시 줄 */
tbody tr.exrow td{color:var(--ink-3);background:repeating-linear-gradient(135deg,
  var(--panel-2) 0 9px, var(--panel-3) 9px 18px);opacity:.92}
tbody tr.exrow:hover td{background:var(--panel-3)}
tbody tr.exrow td.nm{font-weight:600;color:var(--ink-3)}
tbody tr.exrow .chip{background:transparent;border-style:dashed;color:var(--ink-3);border-color:var(--line)}
.exbadge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-3);
  border:1px dashed var(--ink-3);border-radius:4px;padding:1px 5px}
.grp th{background:var(--panel-3);font-weight:700;color:var(--ink);font-size:12px;position:static}
.emptystate{padding:56px 24px;text-align:center}
.emptystate .ico{width:46px;height:46px;border-radius:12px;background:var(--panel-3);color:var(--ink-3);
  display:grid;place-items:center;margin:0 auto 13px}
.emptystate h3{font-size:14.5px;margin-bottom:5px}
.emptystate p{color:var(--ink-3);font-size:13px;margin:0 0 15px}
tfoot td{background:var(--panel-2);font-weight:700;border-top:1px solid var(--line);border-bottom:none;font-size:13px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11.5px;
  font-weight:700;border:1px solid transparent;white-space:nowrap}
.c-blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.c-wait{background:var(--wait-soft);color:var(--wait);border-color:var(--wait-line)}
.c-no{background:var(--no-soft);color:var(--no);border-color:var(--no-line)}
.c-mute{background:var(--panel-3);color:var(--ink-2);border-color:var(--line)}
button.chip{cursor:pointer}
button.chip:hover{filter:brightness(.96)}
.me{background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
.rowacts{display:flex;gap:5px;justify-content:flex-end}
.ibtn{padding:5px 8px;border-radius:6px;font-size:12px;color:var(--ink-3);border:1px solid transparent}
.ibtn:hover{background:var(--panel-3);color:var(--ink);border-color:var(--line)}
.ibtn.danger:hover{color:var(--no);border-color:var(--no-line);background:var(--no-soft)}

/* ---------- right rail ---------- */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:1180px){.rail{position:static}}
@media (max-width:1180px){.rail{position:static}}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-m);overflow:hidden}
.guide-h{display:flex;align-items:center;gap:9px;padding:13px 15px;background:var(--navy);color:#fff}
:root[data-theme="dark"] .guide-h{background:#16243A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .guide-h{background:#16243A}}
.guide-h h3{font-size:13.5px;font-weight:700;flex:1;color:#fff}
.guide-h button{color:#fff;opacity:.85;padding:3px 7px;border-radius:5px;font-size:15px;line-height:1;font-weight:700}
.guide-h button:hover{background:rgba(255,255,255,.16);opacity:1}
.guide-b{padding:6px 15px 15px}
.gitem{padding:12px 0;border-bottom:1px solid var(--line-2)}
.gitem:last-child{border-bottom:none;padding-bottom:4px}
.gitem h4{font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.gitem h4 .n{font-family:var(--num);font-size:11px;color:var(--blue);font-weight:600;
  background:var(--blue-soft);border-radius:4px;padding:1px 5px;flex-shrink:0}
.gitem p{margin:0;font-size:12.3px;color:var(--ink-2);line-height:1.65}
.gitem.warn h4 .n{color:var(--no);background:var(--no-soft)}
.badlist{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.badlab{font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--no);
  background:var(--no-soft);border:1px solid var(--no-line);border-radius:4px;padding:2px 6px}
.badchip{font-size:11.5px;color:var(--no);background:var(--no-soft);border:1px solid var(--no-line);
  border-radius:5px;padding:2px 7px;text-decoration:line-through;text-decoration-thickness:1px}
.guide-cta{width:100%;margin-top:14px;padding:11px;font-size:12.8px;justify-content:center}
/* 페이지 푸터 */
.pagefoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px;padding-top:18px;
  border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.pf-contact{margin-left:auto;display:inline-flex;align-items:center;gap:7px}
.pf-contact b{color:var(--ink-2);font-weight:700}

/* 탭 + 필터 한 줄 */
.tabrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 20px;border-bottom:1px solid var(--line-2)}
.tabrow .subtabs{padding:0;border-bottom:none;flex:1;min-width:0}
.tabrow .filters{padding:8px 0;gap:9px;flex-shrink:0;flex-wrap:nowrap}
@media (max-width:820px){.tabrow .filters{flex-wrap:wrap}}
.scopenote{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.card-foot{padding:12px 20px;border-top:1px solid var(--line-2);background:var(--panel-2);
  font-size:12.3px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.card-foot svg{width:14px;height:14px;flex-shrink:0}
.exlead{display:inline-block;margin-top:7px;color:var(--ink-3);font-size:12px}

/* ---------- login ---------- */
body.login-mode{background:var(--panel)}
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.42fr 1fr;gap:0;
  padding:22px;background:var(--panel)}
.login-art{position:relative;border-radius:20px;overflow:hidden;isolation:isolate;
  background:#2a1d10 url("/login-bg.jpg") center/cover no-repeat;
  display:flex;flex-direction:column;justify-content:space-between;padding:34px 38px;min-height:560px}
.login-art::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(20,14,6,.42) 0%,rgba(20,14,6,.06) 34%,rgba(14,10,4,.72) 100%)}
.art-logo{height:22px;width:auto;align-self:flex-start;filter:drop-shadow(0 1px 6px rgba(0,0,0,.45))}
.art-copy{color:#fff;max-width:38ch}
.art-copy h2{font-size:clamp(21px,2.05vw,30px);font-weight:800;line-height:1.38;letter-spacing:-.038em;text-wrap:nowrap;
  color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.art-copy p{margin:12px 0 0;font-size:14px;color:rgba(255,255,255,.88);text-shadow:0 1px 10px rgba(0,0,0,.5)}
.art-rule{display:block;width:74px;height:2px;background:rgba(255,255,255,.55);margin:22px 0 13px;border-radius:2px}
.art-tag{font-size:12.5px;color:rgba(255,255,255,.8);letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.5)}

.login-panel{display:grid;place-items:center;padding:34px 20px}
.login-form{width:100%;max-width:392px}
.form-logo{height:26px;width:auto;display:block;margin:0 auto 22px;
  background:var(--logo-bg);padding:var(--logo-pad);border-radius:5px}
.login-form h1{font-size:26px;font-weight:800;letter-spacing:-.035em;text-align:center}
.form-sub{margin:9px 0 26px;text-align:center;color:var(--ink-2);font-size:13.5px}
.form-sub .num{color:var(--ink);font-weight:600}
.login-form .field{margin-bottom:16px}
.login-form label{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--ink)}
.inp{position:relative}
.inp svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  color:var(--ink-3);pointer-events:none}
.inp input{padding:13px 14px 13px 44px;font-size:13.5px;border-radius:9px;background:var(--panel)}
.inp input::placeholder{color:var(--ink-3)}
.field-hint{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
.login-btn{width:100%;padding:14px;font-size:14.5px;border-radius:9px;margin-top:8px;gap:9px}
.login-btn svg{width:17px;height:17px}
