<link rel="icon" href="/favicon.png">
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<template id="tpl-login">
  <div class="login">
    <section class="login-art">
      <img class="art-logo" src="/logo-white.png" alt="TECZEN">
      <div class="art-copy">
        <h2>오늘의 배움이<br>내일의 테크젠을 만듭니다.</h2>
        <p>직무의 깊이를 더하고, 함께 성장하는 내일을 준비합니다.</p>
        <span class="art-rule"></span>
        <div class="art-tag">2027년 사외직무교육 계획 수립</div>
      </div>
    </section>

    <section class="login-panel">
      <form class="login-form" id="loginForm">
        <img class="form-logo" src="/logo.png" alt="TECZEN">
        <h1>사외직무교육 계획</h1>
        <p class="form-sub"><span class="num">2027년</span> 교육계획을 등록해 주세요.</p>

        <div id="loginErr"></div>

        <div class="field">
          <label for="liName">이름</label>
          <div class="inp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
            <input id="liName" name="liName" autocomplete="off" placeholder="이름을 입력해 주세요" required>
          </div>
        </div>

        <div class="field">
          <label for="liEmp">사원번호</label>
          <div class="inp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.4"/><circle cx="8.6" cy="11" r="1.9"/><path d="M5.6 16.2a3.4 3.4 0 0 1 6 0M14 10h4.2M14 13.6h3"/></svg>
            <input id="liEmp" name="liEmp" class="num" inputmode="numeric" autocomplete="off" placeholder="사원번호를 입력해 주세요" required>
          </div>
          <p class="field-hint">이름과 사원번호로 로그인할 수 있습니다.</p>
        </div>

        <button class="btn login-btn" type="submit">로그인
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13.5 6.5 20 12l-6.5 5.5"/></svg>
        </button>

        <p class="login-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2 19.5 6v6.3c0 4-3.1 7.2-7.5 8.5-4.4-1.3-7.5-4.5-7.5-8.5V6z"/></svg>
          로그인 후 소속 팀의 교육계획을 확인할 수 있습니다.
        </p>

        <div class="login-foot">
          <svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4-2 1.4a12 12 0 0 0 5.6 5.6l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2Z"/></svg>
          <div>
            <div class="foot-lab">문의 사항</div>
            <div class="foot-val">미래성장팀 이재용 매니저</div>
            <div class="foot-val num">055-280-1741</div>
          </div>
        </div>
        <p class="copyright">&copy; TECZEN. All rights reserved.</p>
      </form>
    </section>
  </div>
</template>
