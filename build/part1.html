<title>테크젠 법정의무교육 이수관리</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#fafbfc; --ink:#16181d; --ink2:#5b6472;
  --line:#e2e5ea; --line2:#eef0f4; --brand:#1f5fd8; --brand-soft:#e8f0ff;
  --ok:#12805c; --ok-soft:#e2f5ee; --warn:#b26a00; --warn-soft:#fdf1dd;
  --bad:#c0392f; --bad-soft:#fdeceb; --mute:#8b95a3; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --radius:10px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --panel:#171b21; --panel2:#1c2128; --ink:#e6e9ee; --ink2:#9aa5b4;
  --line:#272d36; --line2:#20262e; --brand:#5b8cf5; --brand-soft:#16243f;
  --ok:#3ecf9a; --ok-soft:#10291f; --warn:#e0a33c; --warn-soft:#2a2113;
  --bad:#f0736a; --bad-soft:#2d1817; --mute:#6f7b8b; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --panel2:#1c2128; --ink:#e6e9ee; --ink2:#9aa5b4;
  --line:#272d36; --line2:#20262e; --brand:#5b8cf5; --brand-soft:#16243f;
  --ok:#3ecf9a; --ok-soft:#10291f; --warn:#e0a33c; --warn-soft:#2a2113;
  --bad:#f0736a; --bad-soft:#2d1817; --mute:#6f7b8b; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 80px}
/* header */
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
.top-in{max-width:1560px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:16px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.logo .dot{width:9px;height:9px;border-radius:3px;background:var(--brand)}
.sub{color:var(--ink2);font-size:12px}
.spacer{flex:1}
.dday{font-family:var(--mono);font-size:12px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:5px 10px;border-radius:20px;font-weight:700}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink2)}
.iconbtn:hover{color:var(--ink);border-color:var(--brand)}
/* tabs */
nav.tabs{display:flex;gap:2px;max-width:1560px;margin:0 auto;padding:0 20px;overflow-x:auto}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;color:var(--ink2);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabs button:hover{color:var(--ink)}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:14px}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .note{font-size:11.5px;color:var(--mute);margin-top:2px}
.bar{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.bar.ok>i{background:var(--ok)}
/* filters */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.filters label{font-size:11.5px;color:var(--ink2);font-weight:600;display:flex;flex-direction:column;gap:4px}
.filters select,.filters input{min-width:130px}
.btn{background:var(--brand);color:#fff;border:1px solid transparent;border-radius:7px;padding:7px 13px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--brand);color:var(--brand);filter:none}
.btn.ok{background:var(--ok)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
/* table */
.tablewrap{overflow:auto;max-height:calc(100vh - 340px);border-top:1px solid var(--line2)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-size:11.5px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
thead th:hover{color:var(--brand)}
tbody tr:hover{background:var(--panel2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.p-bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.p-mute{background:var(--line2);color:var(--ink2)}
.p-brand{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 28%,transparent)}
.tag-mgr{background:var(--brand-soft);color:var(--brand)}
.tag-lead{background:var(--warn-soft);color:var(--warn)}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* misc */
.hint{font-size:11.5px;color:var(--mute);line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:12px;resize:vertical}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.chip b{font-weight:700}
.chip .x{cursor:pointer;color:var(--mute);font-weight:700}
.chip .x:hover{color:var(--bad)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:600;opacity:0;transition:.25s;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
details.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:9px;overflow:hidden}
details.acc>summary{padding:10px 14px;cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:9px;background:var(--panel2)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:before{content:"▸";color:var(--mute);transition:.15s}
details.acc[open]>summary:before{transform:rotate(90deg)}
details.acc .body{padding:12px 14px;border-top:1px solid var(--line2)}
.stepbox{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:11px 14px;margin-bottom:10px}
.stepbox h4{margin:0 0 5px;font-size:12.5px;font-weight:700}
.warnbox{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:8px;padding:11px 14px;color:var(--ink);font-size:12px;line-height:1.65}
.okbox{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 28%,transparent);border-radius:8px;padding:11px 14px;font-size:12px;line-height:1.65}
.deptbar{display:flex;align-items:center;gap:10px;padding:6px 0}
.deptbar .nm{width:230px;font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deptbar .tr{flex:1;height:16px;background:var(--line2);border-radius:4px;overflow:hidden;position:relative}
.deptbar .tr>i{display:block;height:100%;background:var(--ok)}
.deptbar .pc{width:110px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--brand);cursor:pointer;vertical-align:-2px}
.mini{font-size:11px;padding:3px 8px;border-radius:6px}
code{font-family:var(--mono);background:var(--line2);padding:1px 5px;border-radius:4px;font-size:11.5px}
</style>
