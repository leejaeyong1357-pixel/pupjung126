<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>사외직무교육 계획 취합</title>
<style>
:root{
  --navy:#0B3C77; --blue:#1A6AD4; --blue-soft:#EAF1FC; --blue-line:#C6DAF6;
  --ground:#F4F6FA; --panel:#FFFFFF; --panel-2:#FAFBFD; --panel-3:#F1F4F9;
  --ink:#0E1726; --ink-2:#55647B; --ink-3:#8795A8;
  --line:#E1E7F0; --line-2:#EDF1F6;
  --ok:#0C7A52; --ok-soft:#E4F4EC; --ok-line:#B9E2CE;
  --wait:#A96500; --wait-soft:#FDF2E2; --wait-line:#F0D7AE;
  --no:#C62828; --no-soft:#FCEBEB; --no-line:#F3C9C9;
  --shadow-s:0 1px 2px rgba(11,60,119,.06);
  --shadow-m:0 1px 3px rgba(11,60,119,.07),0 8px 24px rgba(11,60,119,.06);
  --shadow-l:0 18px 50px rgba(11,60,119,.16);
  --r:10px; --logo-pad:0px; --logo-bg:transparent;
  /* 외부에서 내려받지 않고 PC에 이미 깔린 글꼴만 씁니다(인터넷 불필요). */
  --kr:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
       "Apple SD Gothic Neo","Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
  --num:var(--kr);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#5E9BEC; --blue:#4D8FE8; --blue-soft:#15243A; --blue-line:#27446E;
  --ground:#0C1118; --panel:#141A23; --panel-2:#19202B; --panel-3:#1E2630;
  --ink:#E8EDF4; --ink-2:#9AAABF; --ink-3:#6E7F96;
  --line:#252F3C; --line-2:#1F2733;
  --ok:#43C892; --ok-soft:#0E2A20; --ok-line:#1D4A38;
  --wait:#E0A84A; --wait-soft:#2B2113; --wait-line:#4A3A1C;
  --no:#F0736A; --no-soft:#2D1817; --no-line:#4E2624;
  --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow-m:0 2px 10px rgba(0,0,0,.45);
  --shadow-l:0 18px 50px rgba(0,0,0,.6);
  --logo-pad:5px 9px; --logo-bg:#fff;
}}
:root[data-theme="dark"]{
  --navy:#5E9BEC; --blue:#4D8FE8; --blue-soft:#15243A; --blue-line:#27446E;
  --ground:#0C1118; --panel:#141A23; --panel-2:#19202B; --panel-3:#1E2630;
  --ink:#E8EDF4; --ink-2:#9AAABF; --ink-3:#6E7F96;
  --line:#252F3C; --line-2:#1F2733;
  --ok:#43C892; --ok-soft:#0E2A20; --ok-line:#1D4A38;
  --wait:#E0A84A; --wait-soft:#2B2113; --wait-line:#4A3A1C;
  --no:#F0736A; --no-soft:#2D1817; --no-line:#4E2624;
  --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow-m:0 2px 10px rgba(0,0,0,.45);
  --shadow-l:0 18px 50px rgba(0,0,0,.6);
  --logo-pad:5px 9px; --logo-bg:#fff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--kr);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--kr);font-size:13.5px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
input[type=date]{font-family:var(--num)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow-s)}
.topbar-in{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:26px;height:60px}
@media (max-width:900px){
  .topbar-in{height:auto;flex-wrap:wrap;gap:10px;padding:10px 16px}
  .brand{order:1} .topright{order:2;margin-left:auto}
  .mainnav{order:3;flex:1 0 100%;border-top:1px solid var(--line-2);padding-top:8px}
  .who .nm,.who .dp{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn span{display:none}
}
.brand{display:flex;align-items:center;gap:13px;flex-shrink:0}
.brand img{height:19px;width:auto;display:block;background:var(--logo-bg);padding:var(--logo-pad);border-radius:5px}
.brand .sep{width:1px;height:17px;background:var(--line)}
.brand .app{font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em;white-space:nowrap}
.mainnav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.mainnav::-webkit-scrollbar{display:none}
.mainnav button{padding:8px 13px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.mainnav button:hover{background:var(--panel-3);color:var(--ink)}
.mainnav button.on{color:var(--blue);background:var(--blue-soft);font-weight:700}
.mainnav button .n{margin-left:6px;font-family:var(--num);font-size:11px;background:var(--no);color:#fff;
  padding:1px 5px;border-radius:9px;font-weight:600;vertical-align:1px}
.topright{display:flex;align-items:center;gap:12px;flex-shrink:0}
.yearsel{width:auto;padding:6px 9px;font-size:13px;font-family:var(--num);font-weight:600}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.who .nm{font-size:13px;font-weight:700;line-height:1.25}
.who .dp{font-size:11.5px;color:var(--ink-3);line-height:1.25}
.iconbtn{padding:7px 9px;border-radius:7px;color:var(--ink-3);font-size:12.5px;display:flex;align-items:center;gap:5px}
.iconbtn:hover{background:var(--panel-3);color:var(--ink)}

/* ---------- layout ---------- */
.shell{max-width:1440px;margin:0 auto;padding:26px 24px 90px;min-width:0;display:grid;
  grid-template-columns:minmax(0,1fr) 296px;gap:24px;align-items:start}
@media (max-width:1180px){.shell{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.shell{padding:18px 16px 70px}}
.shell>main{min-width:0}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ok);
  background:var(--ok-soft);border:1px solid var(--ok-line);padding:4px 11px;border-radius:20px;margin-bottom:9px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.eyebrow b{margin-left:2px;font-weight:800}
.eyebrow.urgent{color:var(--wait);background:var(--wait-soft);border-color:var(--wait-line)}
.eyebrow.closed{color:var(--no);background:var(--no-soft);border-color:var(--no-line)}
.pagehead h1{font-size:26px;font-weight:900;letter-spacing:-.035em}
.pagehead p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px}
.pagehead .acts{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 17px;border-radius:8px;
  font-size:13.5px;font-weight:700;background:var(--blue);color:#fff;box-shadow:var(--shadow-s);transition:.14s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue);filter:none}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:7px}
.btn.ok{background:var(--ok)} .btn.no{background:var(--no)}
.btn[disabled]{opacity:.45;pointer-events:none}

.note{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:var(--r);
  padding:12px 15px;font-size:13px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.note svg{flex-shrink:0;margin-top:1px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-m);margin-bottom:20px;overflow:hidden}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:17px 20px;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:none}
@media (max-width:760px){.kpi:nth-child(2n){border-right:none}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line-2)}}
.kpi .lab{font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.01em}
.kpi .val{font-family:var(--num);font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:3px;line-height:1.15}
.kpi .val small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.accent .val{color:var(--blue)}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-m);overflow:hidden}
.card+.card{margin-top:20px}
.card-h{padding:15px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:15px;display:flex;align-items:center;gap:9px}
.count{font-family:var(--num);font-size:12px;font-weight:600;background:var(--panel-3);color:var(--ink-2);
  padding:2px 8px;border-radius:20px}
.card-h .right{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;max-width:100%}
.card-b{padding:18px 20px}
.subtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{padding:11px 3px;margin-right:20px;font-size:13.5px;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:700}
.subtabs button:hover{color:var(--ink)}
.searchwrap{position:relative;width:250px;max-width:100%}
.searchwrap input{padding-left:33px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
select.filt{width:auto;min-width:120px;font-size:13px;padding:8px 10px}

/* ---------- table ---------- */
.tw{overflow-x:auto;scrollbar-width:thin}
.tw::-webkit-scrollbar{height:9px}
.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.tw::-webkit-scrollbar-track{background:var(--panel-2)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.6px}
th,td{padding:10px 11px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line-2)}
thead th{background:var(--panel-2);font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.01em;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
thead th.ctr,td.ctr{text-align:center}
thead th.rt,td.rt{text-align:right}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:none}
td.nm{font-weight:700}
.grp th{background:var(--panel-3);font-weight:700;color:var(--ink);font-size:12px;position:static}
.emptystate{padding:56px 24px;text-align:center}
.emptystate .ico{width:46px;height:46px;border-radius:12px;background:var(--panel-3);color:var(--ink-3);
  display:grid;place-items:center;margin:0 auto 13px}
.emptystate h3{font-size:14.5px;margin-bottom:5px}
.emptystate p{color:var(--ink-3);font-size:13px;margin:0 0 15px}
tfoot td{background:var(--panel-2);font-weight:700;border-top:1px solid var(--line);border-bottom:none;font-size:13px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11.5px;
  font-weight:700;border:1px solid transparent;white-space:nowrap}
.c-blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.c-wait{background:var(--wait-soft);color:var(--wait);border-color:var(--wait-line)}
.c-no{background:var(--no-soft);color:var(--no);border-color:var(--no-line)}
.c-mute{background:var(--panel-3);color:var(--ink-2);border-color:var(--line)}
button.chip{cursor:pointer}
button.chip:hover{filter:brightness(.96)}
.me{background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
.rowacts{display:flex;gap:5px;justify-content:flex-end}
.ibtn{padding:5px 8px;border-radius:6px;font-size:12px;color:var(--ink-3);border:1px solid transparent}
.ibtn:hover{background:var(--panel-3);color:var(--ink);border-color:var(--line)}
.ibtn.danger:hover{color:var(--no);border-color:var(--no-line);background:var(--no-soft)}

/* ---------- right rail ---------- */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:1180px){.rail{position:static}}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-m);overflow:hidden}
.guide-h{display:flex;align-items:center;gap:9px;padding:13px 15px;background:var(--navy);color:#fff}
:root[data-theme="dark"] .guide-h{background:#16243A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .guide-h{background:#16243A}}
.guide-h h3{font-size:13.5px;font-weight:700;flex:1;color:#fff}
.guide-h button{color:#fff;opacity:.85;padding:3px 7px;border-radius:5px;font-size:15px;line-height:1;font-weight:700}
.guide-h button:hover{background:rgba(255,255,255,.16);opacity:1}
.guide-b{padding:6px 15px 15px}
.gitem{padding:12px 0;border-bottom:1px solid var(--line-2)}
.gitem:last-child{border-bottom:none;padding-bottom:4px}
.gitem h4{font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.gitem h4 .n{font-family:var(--num);font-size:11px;color:var(--blue);font-weight:600;
  background:var(--blue-soft);border-radius:4px;padding:1px 5px;flex-shrink:0}
.gitem p{margin:0;font-size:12.3px;color:var(--ink-2);line-height:1.65}
.gitem.warn h4 .n{color:var(--no);background:var(--no-soft)}
.railfoot{margin-top:13px;font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.6}

/* ---------- login ---------- */
/* 로그인 화면일 때는 본문 배경까지 흰색으로 */
body.login-mode{background:var(--panel)}
.login{min-height:100%;display:grid;place-items:center;padding:40px 16px;background:var(--panel)}
.loginbox{width:100%;max-width:400px}
.loginbox .brandbig{display:flex;justify-content:center;margin-bottom:26px}
.loginbox .brandbig img{height:26px;background:var(--logo-bg);padding:var(--logo-pad);border-radius:5px}
.logincard{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-m);padding:28px}
.logincard h1{font-size:19px;font-weight:900;letter-spacing:-.03em;text-align:center}
.logincard .yr{font-family:var(--num);color:var(--blue)}
.logincard .sub{text-align:center;color:var(--ink-2);font-size:13px;margin:7px 0 22px}
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
.frow label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
.field input{padding:11px 13px;font-size:14px}
.loginerr{background:var(--no-soft);border:1px solid var(--no-line);color:var(--no);border-radius:8px;
  padding:10px 13px;font-size:12.5px;font-weight:500;margin-bottom:14px}
.logincard .btn{width:100%;padding:12px;font-size:14px;margin-top:4px}
.loginhint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3);line-height:1.7}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,19,35,.5);backdrop-filter:blur(3px);z-index:100;
  display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-l);width:100%;max-width:700px;
  border:1px solid var(--line);margin:auto;max-height:calc(100dvh - 40px);display:flex;flex-direction:column}
.modal.wide{max-width:950px}
.modal.narrow{max-width:460px}
.modal-h{padding:19px 22px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.modal-h h2{font-size:16.5px;font-weight:800;letter-spacing:-.025em}
.modal-h p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.modal-h button{margin-left:auto;color:var(--ink-3);font-size:21px;line-height:1;padding:4px 8px;border-radius:7px;align-self:flex-start}
.modal-h button:hover{background:var(--panel-3);color:var(--ink)}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{padding:15px 22px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;
  background:var(--panel-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.frow.c3{grid-template-columns:1fr 1fr 1fr}
.frow.c1{grid-template-columns:1fr}
@media (max-width:620px){.frow,.frow.c3{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.55}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--panel)}
.seg button.on{background:var(--blue);color:#fff}
.seg button+button{border-left:1px solid var(--line)}
.exstrip{display:flex;gap:11px;align-items:flex-start;background:var(--panel-3);border:1px dashed var(--line);
  border-radius:9px;padding:12px 14px;margin-bottom:17px}
.extag{flex-shrink:0;background:var(--ink-3);color:var(--panel);font-size:10.5px;font-weight:800;
  padding:2px 7px;border-radius:4px;letter-spacing:.04em;margin-top:1px}
.exbody{font-size:12.4px;color:var(--ink-2);line-height:1.75}
.exbody b{color:var(--ink);font-weight:700}
.exnote{background:var(--wait-soft);border:1px solid var(--wait-line);border-radius:8px;padding:11px 14px;
  font-size:12.5px;color:var(--ink);margin-bottom:16px;line-height:1.6}
.calc{background:var(--panel-3);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--ink-2);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calc b{font-family:var(--num);color:var(--ink);font-size:14px}
.rejbox{background:var(--no-soft);border:1px solid var(--no-line);border-radius:8px;padding:13px 15px;font-size:13px;line-height:1.7}
.rejbox .who{font-size:11.5px;color:var(--ink-3);margin-top:7px;border:none;padding:0}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);z-index:200;
  background:var(--ink);color:var(--ground);padding:11px 19px;border-radius:9px;font-size:13px;font-weight:600;
  opacity:0;transition:.22s;pointer-events:none;box-shadow:var(--shadow-l);max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--wait-soft);border-bottom:1px solid var(--wait-line);color:var(--ink);
  font-size:12.5px;padding:9px 24px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="icon" href="/favicon.png">
<script src="/org.js"></script>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<template id="tpl-login">

/* ---------- 서버 통신 ---------- */
async function apiCall(path, opts={}){
  let res;
  try{
    res = await fetch(path, {credentials:"same-origin",
      headers:{"Content-Type":"application/json"}, ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined});
  }catch(e){
    OFFLINE=true;
    throw new Error("서버에 연결하지 못했습니다. 서버가 켜져 있는지 확인해 주세요.");
  }
  OFFLINE=false;
  let data={};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    if(res.status===401 && ME){ ME=null; render(); }
    throw new Error(data.error || "처리하지 못했습니다. 다시 시도해 주세요.");

  return data;
}
function applyBootstrap(d){

  ROWS=d.plans||[];
}
async function boot(){
  try{ applyBootstrap(await apiCall("/api/bootstrap")); }
  catch(e){ toast(e.message,5000); }

}

}

}
const fmtDeadline = () => {
  if(!DEADLINE) return "";
  const d=new Date(DEADLINE+"T00:00:00");
  return `${d.getMonth()+1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]})`;
};

/* 같은 날이면 하루, 아니면 시작 ~ 종료(월-일만) */
function schedule(r){
  if(!r.start) return "-";
  if(r.start===r.end) return esc(r.start);
  return esc(r.start)+" ~ "+esc(String(r.end||"").slice(5));
}

/* ---------- 렌더 ---------- */
function render(){
  const app=$("#app");
  document.body.classList.toggle("login-mode", !ME);
  if(!ME){ app.innerHTML=""; app.appendChild($("#tpl-login").content.cloneNode(true)); bindLogin(); return; }
  const sc=scopeOf(), vis=visibleRows(), rows=filtered(vis);
  const pend=vis.filter(r=>r.status==="pending" && canApprove(r)).length;
  app.innerHTML = topbar(sc,pend) + `<div class="shell"><main>${
      VIEW==="admin" && isAdmin() ? adminView(vis) : planView(sc,vis,rows)
    }</main><aside class="rail">${guideRail()}</aside></div>`;
  bindAll();
}

function topbar(sc,pend){
  const label = sc.kind==="admin" ? "전체 관리자"
              : sc.kind==="sil"   ? ME.dept+" 총괄"
              : sc.kind==="lead"  ? ME.dept+" 팀장" : ME.dept;
  const tabs=[["team", sc.kind==="member"?"우리 팀 교육계획":"소속 교육계획",0]];
  if(sc.kind!=="member") tabs.push(["appr","승인 관리",pend]);
  if(isAdmin()) tabs.push(["admin","전체 현황",0]);
  return `<header class="topbar"><div class="topbar-in">
    <div class="brand"><img src="${LOGO}" alt="TECZEN"><span class="sep"></span><span class="app">교육계획</span></div>
    <nav class="mainnav">${tabs.map(([k,t,n])=>
      `<button data-view="${k}" class="${VIEW===k?"on":""}">${esc(t)}${n?`<span class="n">${n}</span>`:""}</button>`).join("")}</nav>
    <div class="topright">
      <select class="yearsel" id="yearSel" aria-label="연도"><option>2027년</option></select>
      <button class="iconbtn" id="themeBtn" title="화면 밝기 전환" aria-label="화면 밝기 전환">${IC.theme}</button>
      <div class="who"><div class="avatar">${esc(ME.name.slice(0,1))}</div>
        <div><div class="nm">${esc(ME.name)} ${esc(ME.position)}</div><div class="dp">${esc(label)}</div></div>
      </div>
      <button class="iconbtn" id="logoutBtn">${IC.out}<span>로그아웃</span></button>
    </div>
  </div>${OFFLINE?`<div class="banner">서버에 연결하지 못했습니다. 서버가 켜져 있는지 확인한 뒤 새로고침해 주세요.</div>`
    :CLOSED?`<div class="banner"><b>${esc(fmtDeadline())} 취합이 마감되었습니다.</b> 추가 등록이나 수정이 필요하면 미래성장팀 이재용 매니저에게 문의해 주세요.</div>`:""}</header>`;
}

/* 마감까지 남은 날짜를 눈에 띄게 */
function deadlineChip(){
  const n=daysToDeadline();
  if(CLOSED) return `<div class="eyebrow closed"><span class="dot"></span>취합 마감 · ${esc(fmtDeadline())}</div>`;
  const urgent = n!==null && n<=7;
  return `<div class="eyebrow${urgent?" urgent":""}"><span class="dot"></span>계획 취합 중 · ${esc(fmtDeadline())}까지
    <b class="num">${n===0?"오늘 마감":"D-"+n}</b></div>`;
}

    </div>

      sc.kind==="admin" ? "전체 조직의 교육계획을 조회할 수 있어요."
    : sc.kind==="sil"   ? `<b>${esc(ME.dept)}</b> 산하 전체 팀의 교육계획을 조회할 수 있어요.`

function statusCell(r){

  return `<span class="chip ${s.cls}">${s.label}</span>`;
}

  const sc=$("#scrim");

  $$("[data-close]",sc).forEach(b=>b.onclick=closeModal);   // 모든 모달의 닫기·취소 버튼

}

/* ---------- 엑셀 ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
const ENC=new TextEncoder();
function zipStore(files){
  const parts=[],cd=[];let off=0;
  files.forEach(f=>{const name=ENC.encode(f.name),data=f.data,c=crc32(data);
    const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);
    dv.setUint16(10,0,true);dv.setUint16(12,0x21,true);dv.setUint32(14,c,true);
    dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true);lh.set(name,30);parts.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);
    cv.setUint16(12,0,true);cv.setUint16(14,0x21,true);cv.setUint32(16,c,true);
    cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);
    cv.setUint32(42,off,true);ch.set(name,46);cd.push(ch);off+=lh.length+data.length;});
  let cdLen=0;cd.forEach(c=>cdLen+=c.length);
  const end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,cd.length,true);ev.setUint16(10,cd.length,true);
  ev.setUint32(12,cdLen,true);ev.setUint32(16,off,true);
  return new Blob([...parts,...cd,end],{type:"application/zip"});
}
function sheetXml(rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;
    r.forEach((v,ci)=>{let col="",n=ci;do{col=String.fromCharCode(65+n%26)+col;n=Math.floor(n/26)-1;}while(n>=0);
      const ref=col+(ri+1), s=ri===0?' s="1"':"";
      if(typeof v==="number"&&isFinite(v)) x+=`<c r="${ref}"${s}><v>${v}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${esc(v??"")}</t></is></c>`;});
    x+="</row>";});
  return x+"</sheetData></worksheet>";
}

  if(!vis.length){ toast("내려받을 교육계획이 없습니다."); return; }
  const head=["순번","구분","사번","부서","직급","성명","교육구분","교육기관","교육과정",
              "시작일","종료일","일수","교육장소","교육시간","교육비(원)","승인상태","반려사유","등록자"];
  const plans=[head,...filtered(vis).map((r,i)=>[i+1,r.jobType,r.emp,r.dept,r.grade||"",r.name,r.category,r.org,r.course,
              r.start,r.end,Number(r.days)||0,r.place,Number(r.hours)||0,Number(r.cost)||0,
              (STATUS[r.status]||STATUS.pending).label,r.rejectReason||"",r.createdByName||""])];
  const silRows=[["실","팀 수","계획","인원","교육시간","예상 교육비(원)"]];
  Object.keys(ORG).forEach(s=>{const teams=[s,...(ORG[s]||[])].filter(t=>TEAMS.includes(t));
    const rs=vis.filter(r=>teams.includes(r.dept));
    silRows.push([s,teams.length,rs.length,new Set(rs.map(r=>r.emp)).size,sum(rs,"hours"),sum(rs,"cost")]);});
  const teamRows=[["실","팀","계획","인원","승인 확정","대기","반려","교육시간","예상 교육비(원)"]];
  Object.entries(ORG).forEach(([s,ts])=>[s,...ts].filter(t=>TEAMS.includes(t)).forEach(t=>{
    const rs=vis.filter(r=>r.dept===t);
    teamRows.push([s,t,rs.length,new Set(rs.map(r=>r.emp)).size,rs.filter(r=>r.status==="approved").length,
      rs.filter(r=>r.status==="pending").length,rs.filter(r=>r.status==="rejected").length,sum(rs,"hours"),sum(rs,"cost")]);}));
  const blob=xlsxBlob([{name:"교육계획",rows:plans},{name:"실별 집계",rows:silRows},{name:"팀별 집계",rows:teamRows}]);
  const filename=`${YEAR}년_사외직무교육계획_${new Date().toISOString().slice(0,10).replace(/-/g,"")}.xlsx`;
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
  toast("엑셀 파일을 내려받았습니다.");
}

/* ---------- 이벤트 ---------- */
function bindLogin(){
  $("#loginForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=$("#loginForm button[type=submit]");
    const name=$("#liName").value.trim(), emp=$("#liEmp").value.trim().replace(/\D/g,"");
    const err=m=>{ $("#loginErr").innerHTML=`<div class="loginerr">${esc(m)}</div>`; btn.disabled=false; };
    if(!name||!emp) return err("성명과 사번을 모두 입력해 주세요.");
    btn.disabled=true;
    try{
      applyBootstrap(await apiCall("/api/login",{method:"POST",body:{name,emp}}));
      VIEW="team"; SUB="all"; Q=""; FTEAM=""; FCAT=""; render();
      toast(ME.name+"님, 환영합니다. "+ME.dept+"으로 등록되었습니다.");
    }catch(ex){ err(ex.message); }
  });
}
function bindAll(){
  $$(".mainnav button").forEach(b=>b.onclick=()=>{VIEW=b.dataset.view;SUB="all";Q="";render();});
  $$("[data-sub]").forEach(b=>b.onclick=()=>{SUB=b.dataset.sub;render();});
  const lo=$("#logoutBtn"); if(lo) lo.onclick=async()=>{
    try{ await apiCall("/api/logout",{method:"POST"}); }catch(e){}
    ME=null; ROWS=[]; render();
  };
  const th=$("#themeBtn"); if(th) th.onclick=toggleTheme;
  const gt=$("#guideToggle"); if(gt) gt.onclick=()=>{
    const m=localStorage.getItem("teczen_guide_min")==="1";
    try{ localStorage.setItem("teczen_guide_min",m?"0":"1"); }catch(e){}
    render();
  };
  [["#addBtn"],["#addBtn2"]].forEach(([s])=>{const b=$(s); if(b) b.onclick=()=>planForm(null);});
  const ex=$("#exBtn"); if(ex) ex.onclick=exampleModal;
  const xb=$("#xlsxBtn"); if(xb) xb.onclick=exportXlsx;
  const ft=$("#fTeam"); if(ft) ft.onchange=()=>{FTEAM=ft.value;render();};
  const fc=$("#fCat");  if(fc) fc.onchange=()=>{FCAT=fc.value;render();};
  const q=$("#q");
  if(q){ q.oninput=()=>{clearTimeout(window._q);window._q=setTimeout(()=>{
    Q=q.value.trim(); const at=document.activeElement===q; render();
    if(at){const n=$("#q"); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} }},220);}; }
  const byId=id=>ROWS.find(r=>r.id===id);
  $$("[data-edit]").forEach(b=>b.onclick=()=>planForm(byId(b.dataset.edit)));
  $$("[data-rej]").forEach(b=>b.onclick=()=>reasonModal(byId(b.dataset.rej)));
  $$("[data-no]").forEach(b=>b.onclick=()=>rejectModal(byId(b.dataset.no)));
  $$("[data-ok]").forEach(b=>b.onclick=()=>{
    const r=byId(b.dataset.ok);
    confirmModal("교육 계획 승인",
      `<b>${esc(r.name)}</b>님의 <b>${esc(r.course)}</b> 계획을 승인합니다.<br>승인하면 등록자에게 승인 확정으로 표시됩니다.`,
      "승인 확정", async()=>{
        try{ await apiCall("/api/plans/"+r.id+"/approve",{method:"POST"});
             toast("승인 확정했습니다."); await refresh(); }
        catch(e){ toast(e.message,4000); }
      });
  });
  $$("[data-del]").forEach(b=>b.onclick=()=>{
    const r=byId(b.dataset.del);
    confirmModal("교육 계획 삭제",
      `<b>${esc(r.course)}</b> 계획을 삭제합니다.<br>삭제하면 되돌릴 수 없습니다.`,
      "삭제", async()=>{
        try{ await apiCall("/api/plans/"+r.id,{method:"DELETE"});
             toast("삭제했습니다."); await refresh(); }
        catch(e){ toast(e.message,4000); }
      }, true);
  });
}
function bindPlanForm(existing){
  const seg=$("#jobSeg"); let job=existing?existing.jobType:"관리직";
  $$("#jobSeg button").forEach(b=>b.onclick=()=>{
    job=b.dataset.job;
    $$("#jobSeg button").forEach(x=>x.classList.toggle("on",x.dataset.job===job));
    $("#mgrPick").hidden = job!=="관리직";
    $("#prdPick").hidden = job==="관리직";
  });
  const recalc=()=>{ $("#pfDays").textContent = daysBetween($("#pfStart").value,$("#pfEnd").value); };
  $("#pfStart").onchange=()=>{ const s=$("#pfStart").value,e=$("#pfEnd");
    if(s&&(!e.value||e.value<s)) e.value=s; recalc(); };
  $("#pfEnd").onchange=recalc;
  $("#pfSave").onclick=async()=>{
    const err=m=>{ $("#pfErr").innerHTML=`<div class="loginerr">${m}</div>`; };
    const g=id=>$(id).value.trim();
    let person;
    if(job==="관리직"){
      person=BY_EMP.get($("#pfPerson").value);
      if(!person) return err("대상자를 선택해 주세요.");
      person={emp:person.emp,name:person.name,dept:person.dept,grade:person.grade};
    }else{
      const emp=g("#pfEmp").replace(/\D/g,""), name=g("#pfName");
      if(!emp||!name) return err("생산직 대상자의 사번과 성명을 입력해 주세요.");
      person={emp,name,dept:$("#pfDept").value,grade:g("#pfGrade")||"생산직"};
    }
    const start=g("#pfStart"), end=g("#pfEnd");
    const org=g("#pfOrg"), course=g("#pfCourse"), place=g("#pfPlace");
    if(!org||!course||!place) return err("교육기관 · 교육과정 · 교육장소를 모두 입력해 주세요.");
    if(!start||!end) return err("교육 시작일과 종료일을 모두 선택해 주세요.");
    if(end<start) return err("종료일이 시작일보다 빠릅니다. 날짜를 다시 확인해 주세요.");
    if(start.slice(0,4)!=String(YEAR)||end.slice(0,4)!=String(YEAR))
      return err(`${YEAR}년 교육계획만 등록할 수 있습니다.`);
    const hours=Number(g("#pfHours").replace(/[^\d.]/g,""));
    const cost =Number(g("#pfCost").replace(/[^\d]/g,""));
    if(!(hours>0)) return err("교육시간을 시간 단위 숫자로 입력해 주세요.");
    if(!isFinite(cost)||cost<0) return err("교육비를 원 단위 숫자로 입력해 주세요. 비용이 없으면 0을 적습니다.");
    const payload={ jobType:job, emp:person.emp, name:person.name, dept:person.dept, grade:person.grade,
      category:$("#pfCat").value, org, course, start, end, place, hours, cost };
    $("#pfSave").disabled=true;
    try{
      if(existing) await apiCall("/api/plans/"+existing.id,{method:"PUT",body:payload});
      else         await apiCall("/api/plans",{method:"POST",body:payload});
      closeModal();
      toast(existing?"수정했습니다. 다시 승인 대기 상태가 됩니다.":"교육 계획을 등록했습니다. 팀장 승인을 기다려 주세요.",3400);
      await refresh();
    }catch(e){ err(e.message); $("#pfSave").disabled=false; }
  };
  recalc();
}

/* ---------- 테마 ---------- */
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "" : "dark";
  next ? document.documentElement.setAttribute("data-theme",next)
       : document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("teczen_theme",next); }catch(e){}
}
try{ const t=localStorage.getItem("teczen_theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}

/* ---------- 시작 ---------- */
render();
boot();
